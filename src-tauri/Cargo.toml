[package]
name = "noveldesk-reader"
version = "0.1.0"
description = "Moya text and comic viewer"
authors = ["Moya Contributors"]
license = "Apache-2.0"
repository = "https://github.com/west-truth/moya-reader"
edition = "2021"

[lib]
name = "noveldesk_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "rt", "time", "net"] }
httpdate = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
