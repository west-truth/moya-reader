# Apply this override only behind a TLS-terminating reverse proxy on the same host.
# The required recovery token also acts as the one-time first-account setup code.
# Browsers use an HttpOnly owner session after setup; the token is not entered on every device.
# Same-origin browser requests are accepted automatically. Set CORS_ALLOWED_ORIGINS
# only when a separate web/desktop origin calls this API cross-origin.
services:
  api:
    environment:
      SERVER_EXPOSURE: external
      READER_AUTH_TOKEN: ${READER_AUTH_TOKEN:?Set the one-time account setup and recovery token before public deployment}
      DATABASE_URL: ${DATABASE_URL:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before public deployment}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before public deployment}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before public deployment}}
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before public deployment}
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before public deployment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before public deployment}
