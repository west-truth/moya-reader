x-server-volumes: &server-volumes
  - server-data:/data/server
  - type: bind
    source: ${VERTEX_CREDENTIALS_HOST_DIR:-./secrets/vertex}
    target: /run/secrets/vertex
    read_only: true

services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      # Browser-visible public identifiers only. Secrets belong in api/worker or their secure stores.
      MOYA_DROPBOX_APP_KEY: ${MOYA_DROPBOX_APP_KEY:-${VITE_DROPBOX_APP_KEY:-}}
      MOYA_DROPBOX_SOURCE_APP_KEY: ${MOYA_DROPBOX_SOURCE_APP_KEY:-${VITE_DROPBOX_SOURCE_APP_KEY:-}}
      MOYA_GOOGLE_DRIVE_CLIENT_ID: ${MOYA_GOOGLE_DRIVE_CLIENT_ID:-${VITE_GOOGLE_DRIVE_CLIENT_ID:-}}
      MOYA_GOOGLE_DRIVE_APP_ID: ${MOYA_GOOGLE_DRIVE_APP_ID:-${VITE_GOOGLE_DRIVE_APP_ID:-}}
      MOYA_GOOGLE_DRIVE_DEVELOPER_KEY: ${MOYA_GOOGLE_DRIVE_DEVELOPER_KEY:-${VITE_GOOGLE_DRIVE_DEVELOPER_KEY:-}}
      MOYA_SUWAYOMI_DEFAULT_URL: ${MOYA_SUWAYOMI_DEFAULT_URL:-${VITE_SUWAYOMI_DEFAULT_URL:-}}
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    logging: *service-logging

  api:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    command: ['node', 'dist/index.js']
    environment:
      <<: *server-common-environment
      HOST: 0.0.0.0
      PORT: 8787
      # Safe only while the web proxy remains loopback-only and is not exposed by another reverse proxy.
      SERVER_EXPOSURE: ${SERVER_EXPOSURE:-loopback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      READER_AUTH_TOKEN: ${READER_AUTH_TOKEN:-}
      # Trust only the immediate Web proxy by default; increase explicitly for an additional NPM hop.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
    volumes: *server-volumes
    # Deliberately no ports: the loopback-published web proxy is the only default host ingress.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    logging: *service-logging

  worker:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    command: ['node', 'dist/worker.js']
    environment:
      <<: *server-common-environment
      RUN_MIGRATIONS_ON_START: 'false'
    volumes: *server-volumes
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-3g}
    logging: *service-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noveldesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noveldesk}
      POSTGRES_DB: ${POSTGRES_DB:-noveldesk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-noveldesk} -d ${POSTGRES_DB:-noveldesk}']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging: *service-logging

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    logging: *service-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-password}
    volumes:
      - minio-data:/data
    ports:
      - '${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    restart: unless-stopped
    mem_limit: ${MINIO_MEMORY_LIMIT:-1g}
    logging: *service-logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  server-data:
