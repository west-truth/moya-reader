map $http_x_forwarded_proto $moya_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 32m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_request_buffering off;
    proxy_pass http://api:8787/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $moya_forwarded_proto;
  }

  # Backup archives are intentionally larger than normal 16 MiB upload chunks.
  # Fastify still enforces the archive contract limit and validates the uncompressed total.
  location /api/backups/ {
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass http://api:8787/api/backups/;
    proxy_http_version 1.1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $moya_forwarded_proto;
  }

  location /health {
    proxy_pass http://api:8787/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ready {
    proxy_pass http://api:8787/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
