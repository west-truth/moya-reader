map $http_x_forwarded_proto $moya_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 32m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_request_buffering off;
    proxy_pass http://api:8787/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $moya_forwarded_proto;
  }

  # Original PDF/comic sources can be much larger than chunked text imports.
  # Stream both large PUT bodies and Range responses without nginx temp files.
  location ~ ^/api/books/[^/]+/source$ {
    client_max_body_size 512m;
    client_body_timeout 900s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $moya_forwarded_proto;
  }

  # Backup archives are intentionally larger than normal 16 MiB upload chunks.
  # Fastify still enforces the archive contract limit and validates the uncompressed total.
  location /api/backups/ {
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://api:8787/api/backups/;
    proxy_http_version 1.1;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $moya_forwarded_proto;
  }

  location /health {
    proxy_pass http://api:8787/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ready {
    proxy_pass http://api:8787/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Chrome checks this file on every deployed update. Never pin an old worker at the proxy layer.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Generated from the container's allow-listed public environment on every start.
  location = /runtime-config.js {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
