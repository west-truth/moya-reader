# Ubuntu host nginx example for Moya.
# Replace moya.example.com and the certificate paths before enabling this file.
# For WireGuard-only access, bind the TLS listen directives to the server's
# WireGuard address (for example, `listen 10.20.0.1:443 ssl http2`).
# Docker Compose must keep WEB_BIND_ADDRESS=127.0.0.1 so nginx is the only ingress.

server {
  listen 80;
  listen [::]:80;
  server_name moya.example.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name moya.example.com;

  ssl_certificate /etc/letsencrypt/live/moya.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/moya.example.com/privkey.pem;

  # Ordinary browser uploads are sent in 512 KiB chunks. The inner Moya
  # nginx and Fastify server apply their own stricter endpoint limits too.
  client_max_body_size 32m;
  client_body_timeout 300s;

  location ^~ /api/backups/ {
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/uploads/ {
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
