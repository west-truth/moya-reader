name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
      web: ${{ steps.scope.outputs.web }}
      settings: ${{ steps.scope.outputs.settings }}
      reader: ${{ steps.scope.outputs.reader }}
      discovery: ${{ steps.scope.outputs.discovery }}
      extensions: ${{ steps.scope.outputs.extensions }}
      native: ${{ steps.scope.outputs.native }}
      deploy: ${{ steps.scope.outputs.deploy }}
      text: ${{ steps.scope.outputs.text }}
      apk: ${{ steps.scope.outputs.apk }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select checks for changed areas
        id: scope
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/quality-scope.mjs

  browser-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify browser artifact
        run: |
          pnpm web:build
          pnpm --filter @moya/web check:artifact
        env:
          WEB_BASE_PATH: /moya-reader/
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Verify native CSP for local covers and user fonts
        run: node --test --test-concurrency=1 scripts/desktop/source-cover-csp.test.mjs scripts/desktop/user-font-csp.test.mjs
      - run: pnpm check:web-pages:browser
        env:
          READER_UI_BROWSER_CHANNEL: chromium
      - run: pnpm check:settings-ux
        if: needs.changes.outputs.settings == 'true'
      - run: pnpm check:discovery-ux
        env:
          READER_UI_BROWSER_CHANNEL: chromium
        if: needs.changes.outputs.discovery == 'true'
      - name: Verify paginated blind reading
        run: node scripts/performance/auto-scroll-smoke.mjs --paginated
        env:
          READER_UI_BROWSER_CHANNEL: chromium
        if: needs.changes.outputs.reader == 'true'
      - run: pnpm check:reader-stability
        env:
          READER_UI_BROWSER_CHANNEL: chromium
        if: needs.changes.outputs.reader == 'true'

  hosted-source:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static checks and shared typecheck (once)
        run: |
          pnpm format:check
          pnpm check:public-source
          pnpm check:licenses:source-release
          pnpm lint
          pnpm check:css
          pnpm check:contract-boundaries
          pnpm typecheck
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Unit and integration tests (de-duplicated)
        run: |
          node --test scripts/ci/quality-scope.test.mjs
          node scripts/ci/quality-tests.mjs
          pnpm test:extension-runtime
          pnpm test:extension-sdk
          pnpm test:extension-cli
      - name: APK source cache tests
        if: needs.changes.outputs.apk == 'true' || needs.changes.outputs.extensions == 'true'
        run: node --test services/apk-worker/catalog.test.mjs services/apk-worker/source-cover-cache.test.mjs services/apk-worker/shared-task.test.mjs
      - name: Verify production server and web bundles
        run: |
          pnpm check:server:production
          pnpm check:hosted
          pnpm exec vite build
      - name: Install and test text-source companion
        working-directory: services/text-source-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
        if: needs.changes.outputs.text == 'true'
      - name: Install browser for original Mangayomi App gate
        run: pnpm exec playwright-core install --with-deps chromium
        if: needs.changes.outputs.extensions == 'true'
      - name: Verify original Mangayomi install through comic reader
        run: pnpm check:extension-mangayomi-app
        env:
          READER_UI_BROWSER_CHANNEL: chromium
        if: needs.changes.outputs.extensions == 'true'

  hosted-compose:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.local-tts.yaml config --quiet
      - name: Validate public and Suwayomi Compose profiles
        run: |
          docker compose -f compose.yaml -f compose.public.yaml config --quiet
          docker compose -f compose.yaml -f compose.public.yaml -f compose.suwayomi.yaml config --quiet
          docker compose -f compose.yaml -f compose.public.yaml -f compose.text-sources.yaml config --quiet
        env:
          READER_AUTH_TOKEN: ci-config-check-only
          POSTGRES_PASSWORD: ci-postgres-config-check-only
          MINIO_ROOT_USER: ci-storage-config-check-only
          MINIO_ROOT_PASSWORD: ci-storage-password-config-check-only
          SUWAYOMI_AUTH_USERNAME: ci-suwayomi-config-check-only
          SUWAYOMI_AUTH_PASSWORD: ci-suwayomi-password-config-check-only
          TEXT_SOURCE_SERVER_KEY: ci-text-source-config-check-only
      - name: Build pinned MinIO source for the isolated Compose test
        # The historical registry image is unavailable. Build the same official
        # release locally; Compose uses this tag without changing deployment defaults.
        run: docker build -f scripts/ci/minio.Dockerfile -t quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z scripts/ci
      - name: Protected Compose import E2E
        run: pnpm check:hosted:e2e -- --public --project-name moya-ci-${{ github.run_id }}-${{ github.run_attempt }}

  windows-native-source:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rust
      - run: pnpm check:native-source
      - run: pnpm check:mobile-readiness
