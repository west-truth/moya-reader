name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-source:
    # Keep the source-release license inventory and hosted deployment checks on
    # the same Linux/glibc family used by the production Node images.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web-server
      - run: pnpm check:mobile-readiness
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.local-tts.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.public.yaml config --quiet
        env:
          READER_AUTH_TOKEN: ci-config-check-only
          CORS_ALLOWED_ORIGINS: https://reader.example.test
      - name: Build hosted images
        if: github.event_name != 'pull_request'
        run: docker compose build web api worker

  windows-native-source:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rust
      - run: pnpm check:native-source
