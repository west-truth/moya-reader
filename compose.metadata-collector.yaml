# Optional self-host webnovel cover/metadata collector.
# The browser still talks only to Moya /api; this container has no host port.
services:
  api:
    environment:
      WEBNOVEL_METADATA_COLLECTOR_URL: http://metadata-collector:8000
    networks:
      default:
      metadata-collector:

  metadata-collector:
    build:
      context: .
      dockerfile: deploy/metadata-collector.Dockerfile
    environment:
      MOYA_COLLECTOR_DATA_DIR: /data
    volumes:
      - metadata-collector-data:/data
    networks:
      - metadata-collector
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    mem_limit: ${METADATA_COLLECTOR_MEMORY_LIMIT:-768m}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}

volumes:
  metadata-collector-data:

networks:
  metadata-collector:
    driver: bridge
